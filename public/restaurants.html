
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fork & Find | Restaurant Directory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="inner-page">
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="index.html" aria-label="Fork &amp; Find — Home" title="Fork &amp; Find — Home"><span class="brand-icon"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M18 3c-3 2-4 5-4 9h4v9M18 3v9"/></svg></span><span class="brand-name">Fork &amp; Find</span></a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="restaurants.html" aria-current="page">Restaurants</a>
            <a href="search.html">Search &amp; Filter</a>
            <a href="top-rated.html">Top Rated</a>
            <a href="add-restaurant.html">Manage</a>
        </nav>
      </div>
    </header>



    <main>

        <section class="restaurant-heading">
            <div>
                <h2>Explore Restaurants</h2>
                <p>Browse all available restaurant records.</p>
            </div>

            <div class="heading-actions">
            <a href="boroughs.html" class="quick-link"><span class="quick-link-icon" aria-hidden="true">⌖</span><span>Browse by Borough</span><span aria-hidden="true">↗</span></a>
            <a href="top-rated.html" class="quick-link"><span class="quick-link-icon" aria-hidden="true">★</span><span>Top Rated</span><span aria-hidden="true">↗</span></a>

            <a href="add-restaurant.html" class="add-button">
                + Add Restaurant
            </a>
            </div>
        </section>

    <div id="results"></div>

    <!-- Restaurant pagination -->
    <div id="pagination" class="pagination" hidden>

        <button
            type="button"
            id="previousPage"
            onclick="changePage(-1)">
            <span class="pagination-arrow">&#10094;</span>
            Previous
        </button>

        <span id="pageInfo">Page 1 of 1</span>

        <button
            type="button"
            id="nextPage"
            onclick="changePage(1)">
            Next
            <span class="pagination-arrow">&#10095;</span>
        </button>

    </div>

    </main>

    <!-- Delete Confirmation -->

    <div id="deleteModal" class="modal">

        <div class="modal-content">

            <h2>Delete Restaurant</h2>

            <p>
                Are you sure you want to delete
                "<strong id="deleteRestaurantName"></strong>"?
            </p>

            <p class="delete-warning">
                This action cannot be undone.
            </p>

            <div class="modal-buttons">

                <button type="button" onclick="cancelDelete()">
                    Cancel
                </button>

                <button
                    type="button"
                    id="confirmDeleteButton"
                    onclick="deleteRestaurant()">
                    Delete Restaurant
                </button>

            </div>

        </div>

    </div>

   <script src="script.js"></script>
   <script>
       // The homepage's Start Searching link opens this page at #filters.
       // Focus the name field only for that link, without changing any filters.
       if (window.location.hash === "#filters") {
           window.addEventListener("load", function () {
               const searchField = document.getElementById("searchName");
               if (searchField) {
                   document.getElementById("filters").scrollIntoView({ block: "start" });
                   searchField.focus({ preventScroll: true });
               }
           });
       }
   </script>

</body>
</html>
